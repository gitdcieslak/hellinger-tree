[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hellinger-tree"
version = "0.1.0"
description = "Small scikit-learn-compatible Hellinger decision tree classifier."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "hellinger-tree contributors" }
]
dependencies = [
  "numpy>=1.22",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
